[project]
name = "vls"
version = "0.1.0"
description = "Vision-Language Steering for diffusion policies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"

dependencies = [
    # --- deep learning core ---
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "torchcodec==0.5",
    "triton==3.3.1",
    "accelerate==1.12.0",
    "lerobot",
    # pi0/pi05 need lerobot's transformers fork: it ships
    # transformers/models/siglip/check.py, which upstream does not have.
    "transformers @ git+https://github.com/huggingface/transformers.git@dcddb970176382c0fcf4521b0c0e6fc15894dfe0",
    # the fork is based on transformers 4.53.x, which caps tokenizers below 0.22
    "tokenizers>=0.21,<0.22",
    "diffusers==0.35.2",
    "timm==1.0.20",
    "safetensors==0.6.2",
    "huggingface-hub==0.35.3",
    "hf-transfer==0.1.9",
    "hf-xet==1.1.10",
    "datasets==4.1.1",
    "einops==0.8.1",
    "kmeans-pytorch==0.3",
    "google-generativeai",

    # --- numerics / science ---
    # lerobot -> rerun-sdk>=0.24 requires numpy>=2, so the old 1.26.4 pin from
    # the conda env is not satisfiable any more. Capped below 2.3 for opencv.
    "numpy>=2.0,<2.3",
    "numpy-quaternion==2024.0.13",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "numba==0.62.1",
    "llvmlite==0.45.1",
    "sympy==1.14.0",
    "networkx==3.6",
    "h5py==3.15.1",
    "pyarrow==21.0.0",

    # --- robotics / kinematics / geometry ---
    # mani-skill pins 0.7.5; leave room for it
    "pytorch-kinematics>=0.7.5",
    "pytorch-seed==0.2.0",
    "arm-pytorch-utilities==0.4.3",
    "transforms3d==0.4.2",
    "trimesh==4.10.0",
    "gymnasium==1.2.2",

    # --- rendering / vision / video ---
    # headless only: no cv2.imshow/waitKey in this codebase, and the two wheels
    # ship the same `cv2` module. Capped below 4.12, which requires numpy>=2.
    "opencv-python-headless>=4.10,<4.12",
    # pyrender/pyglet/pycollada/freetype-py were calvin- and maniskill-era
    # leftovers, unused by this codebase. pyrender in particular hard-pins
    # pyopengl==3.1.0, which lacks the EGL.EGLDeviceEXT that mujoco.egl needs.
    "pyopengl>=3.1.10",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "av==15.1.0",
    "pillow==12.0.0",
    "matplotlib==3.10.7",

    # --- config / CLI ---
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "omegaconf==2.3.0",
    "antlr4-python3-runtime==4.9.3",
    "draccus==0.10.0",
    "tyro==0.9.35",
    "click==8.3.0",
    "pyyaml==6.0.3",
    "pyyaml-include==1.4.1",
    "toml==0.10.2",

    # --- logging / experiment tracking ---
    "wandb==0.21.4",
    # range required by the lerobot fork
    "rerun-sdk>=0.24,<0.27",
    "absl-py==2.3.1",
    "rich==14.2.0",
    "tqdm==4.67.1",
    "termcolor==3.1.0",
    "tabulate==0.9.0",
    "colorlog==6.10.1",

    # --- VLM clients ---
    "openai==2.8.1",

    # --- misc runtime ---
    "requests==2.32.5",
    "jsonlines==4.0.0",
    "parse==1.20.2",
    "psutil==7.1.3",
    "deepdiff==8.6.1",
    "dacite==1.9.2",
    "typeguard==4.4.4",
    "typing-extensions==4.15.0",
    "pynput==1.8.1",
    "pyserial==3.5",
    "pyperclip==1.11.0",
    "packaging==25.0",
]

[project.optional-dependencies]
# LIBERO-PRO is not listed here: it has no PyPI release and its git remote is
# SSH-only, so it stays a manual editable install. From the REPO ROOT:
#
#     uv sync --extra libero
#     uv pip install --no-deps -e third_party/libero_pro -C editable_mode=compat
#
# `-C editable_mode=compat` is required for libero_pro: its `libero/` directory
# has no __init__.py, so setuptools' find_packages() yields an empty package
# list and a modern PEP 660 editable install produces an unimportable package.
# The compat mode puts the source root on sys.path the way `setup.py develop`
# used to, and `libero` then resolves as a namespace package.
#
# Re-run it after any later `uv sync`, which prunes packages it does not
# manage (or pass `uv sync --inexact` to leave it alone).

# Third-party half of the LIBERO / LIBERO-PRO backend (MuJoCo based).
libero = [
    "robosuite==1.4.0",
    # libero_pro/libero/libero/envs/venv.py imports the legacy gym directly
    "gym==0.26.2",
    "mujoco==3.4.0",
    "bddl==1.0.1",
    # LIBERO-plus's env wrapper imports these at module level for its sensor-noise
    # perturbation (motion / gaussian / zoom blur). `wand` also needs the
    # ImageMagick C library present on the system (libmagickwand).
    "wand>=0.6",
    "scikit-image>=0.25",
    # bddl imports future.utils but does not declare it
    "future==0.18.2",
    "easydict==1.9",
    "glfw==2.10.0",
]

# Gemini grounding backend (core/gemini_grounder.py).
gemini = [
    "google-generativeai==0.8.6",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ipython==9.7.0",
    "jupytext==1.18.1",
    "nbformat==5.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "utils"]

[tool.hatch.metadata]
allow-direct-references = true

# --------------------------------------------------------------------------
# uv configuration
# --------------------------------------------------------------------------

[tool.uv]
package = true
# CUDA wheels only exist for linux/x86_64; lock for that platform.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# CUDA 11.8 wheels are not on PyPI. `explicit = true` means only the packages
# routed here via [tool.uv.sources] are fetched from this index.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

# Fork of LeRobot this project targets — see requirements.txt. Installed
# straight from git, so third_party/lerobot does not need checking out.
lerobot = { git = "https://github.com/Treeeplanter/lerobot.git", rev = "fbf0fb1e6a39a9223b61fcd09aead75c95363194" }

# NOTE: third_party/libero_pro is deliberately NOT declared as a path source.
# `uv lock` resolves every extra regardless of what you sync, so a path source
# pointing at a submodule that has not been checked out yet fails the whole
# lock. See the comment above [project.optional-dependencies].
